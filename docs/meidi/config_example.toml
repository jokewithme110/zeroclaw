# stream_mode = "partial"             # 流模式：partial/full（可选，默认 partial）
# draft_update_interval_ms = 1000     # 草稿更新间隔（可选）
# file_retention_days = 7             # 文件保留天数（可选，默认 7）
# max_file_size_mb = 20               # 最大文件大小 MB（可选，默认 20）
# proxy_url = "" # 代理 URL（可选）
