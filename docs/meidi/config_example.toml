locale = "en"
schema_version = 3

# -----------Provider配置 Start-----------------
# Provider的配置信息，该配置可供Agent引用
# `doubao`: provider提供商名
#
[providers.models.doubao.local_custom]
api_key = "xxxxx"
model = "deepseek-v4-flash-260425"
uri = "http://localhost:8888"
temperature = 0.3
timeout_secs = 180

[providers.models.doubao.remote]
api_key = "xxxxx"
model = "deepseek-v4-flash-260425"
temperature = 0.3
timeout_secs = 180
 
# -----------Provider配置 End------------------

# -----------Agent Skill Bundles Start---------
# 配置agent额外绑定的skill路径, 默认会在工作目录下的shared/skills/[common]生成目录，
# skill放在此处agent可进行引用
[skill_bundles.common]

# -----------Agent Skill Bundles End---------

# -----------Agent Config Start---------------
#  配置领域agent，可绑定channel进行消息处理
# `channels`: 哪些channel的消息由此agent进行处理
# 
[agents.movie_agent]
channels = ["webchat.default","lark.default","wecom_ws.default"]
max_tool_iterations = 25
model_provider = "doubao.remote"
risk_profile = "common"
runtime_profile = "default"
skill_bundles = ["common"]
identity = { format = "openclaw"}

# generic agent
[agents.generic_agent]
channels = ["qq.default"]
max_tool_iterations = 25
model_provider = "doubao.local_custom"
risk_profile = "common"
runtime_profile = "default"
identity = { format = "openclaw"}
skill_bundles = ["common"]

[agents.haobai_agent]
max_tool_iterations = 25
model_provider = "doubao.local_custom"
risk_profile = "common"
runtime_profile = "default"
skill_bundles = ["common"]


[agents.router_agent]
model_provider = "doubao.local_custom"
risk_profile = "common"
runtime_profile = "default"
skill_bundles = ["common"]

# -----------Agent Config End---------------

# -----------Channels Config Start---------------
# 配置消息渠道
#
[channels]
ack_reactions = true
cli = true
debounce_ms = 0
message_timeout_secs = 300
session_backend = "jsonl"
session_persistence = true
session_ttl_hours = 3
show_tool_calls = false

[channels.qq.default]
app_id = "xxxx"
app_secret = "xxxxx"
enabled = true

#[channels.webchat.default]
#port = 42618
#listen_path = "/response"
#support_reasoning = true

