[package]
name = "zeroclaw-fixture-static"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reference implementation of a third-party static plugin for ZeroClaw — used by tests and as community-facing template."
publish = false

[dependencies]
zeroclaw-api.workspace = true
anyhow = "1.0"
async-trait = "0.1"
serde_json = { version = "1.0", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
