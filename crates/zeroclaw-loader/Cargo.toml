[package]
name = "zeroclaw-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-side dynamic plugin loader for ZeroClaw — bridges C ABI plugins into RegistrySet."
publish = false

[dependencies]
zeroclaw-api.workspace = true
zeroclaw-log.workspace = true
libloading.workspace = true
anyhow = "1.0"
serde_json = { version = "1.0", default-features = false, features = ["std"] }
toml = { version = "1.0", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
zeroclaw-fixture-dynamic = { workspace = true }
serde_json = "1.0"
