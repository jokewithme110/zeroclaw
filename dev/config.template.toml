workspace_dir = "/zeroclaw-data/workspace"
config_path = "/zeroclaw-data/.zeroclaw/config.toml"
# This is the Ollama Base URL, not a secret key
api_key = "http://host.docker.internal:11434"
default_provider = "ollama"
default_model = "llama3.2"
default_temperature = 0.7

[gateway]
port = 42617
host = "[::]"
allow_public_bind = true
require_pairing = false
web_dist_dir = "/usr/share/zeroclawlabs/web/dist"

# Cost tracking and budget enforcement configuration
# Enable to track API usage costs and enforce spending limits
[cost]
enabled = false
daily_limit_usd = 10.0
monthly_limit_usd = 100.0
warn_at_percent = 80
allow_override = false

# Per-model pricing (USD per 1M tokens)
# Uncomment and customize to override default pricing
# [cost.prices."anthropic/claude-sonnet-4-20250514"]
# input = 3.0
# output = 15.0
#
# [cost.prices."openai/gpt-4o"]
# input = 5.0
# output = 15.0

# ----------------------------------------------------------------------------
# Skills (PR1 + PR2: SkillHub integration)
# ----------------------------------------------------------------------------
# `skillhub_base_url` points the CLI's `skills install clawhub:...` (and
# PR2's `skill_search` / `skill_install` / `skill_remove` agent tools) at
# a self-hosted SkillHub. Default when omitted: https://clawhub.ai
#
# ICT production curated set (8 skills, default for ICT deployments):
# [skills]
# skillhub_base_url = "https://skillhubictst.mec189.cn/enhance"
#
# ICT full self-hosted registry (35 skills, dev/admin only):
# [skills]
# skillhub_base_url = "https://skillhubictst.mec189.cn"
#
# `enable_agent_skill_management` controls whether the running agent
# registers the 3 SkillHub management tools. Default: false.
# Set to true to let the agent discover/install/remove skills at runtime.
# [skills]
# enable_agent_skill_management = true
